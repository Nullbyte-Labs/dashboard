# Self-hosted runner deploy (same pattern as dungeon-daily.com).
# Swap to Cloudflare Pages by replacing the last step with wrangler.
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: python3 -m pip install --user -r requirements.txt

      - name: Build
        run: python3 build.py

      - name: Publish
        run: |
          rsync -a --delete site/ /opt/nullbyte-labs/site/
          docker compose -f /opt/nullbyte-labs/docker-compose.yml restart web
