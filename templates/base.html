<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<meta name="author" content="{{ site.author }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="{% block ogtype %}website{% endblock %}">
<meta name="theme-color" content="#020203">
<link rel="canonical" href="{{ site.url }}{% block canonical %}/{% endblock %}">
<link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="/feed.xml">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="grid-bg" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="tag-icon">&lt;/&gt;</span>
      Nullbyte<em>&#8209;Labs</em>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="/tutorials/"{% if page == 'tutorials' %} aria-current="page"{% endif %}>Tutorials</a>
      <a href="/#tracks">Tracks</a>
      <a href="{{ site.youtube }}" rel="me noopener">YouTube</a>
      <a href="{{ site.github }}" rel="me noopener">GitHub</a>
    </nav>
  </div>
</header>

<main id="main">
{% block main %}{% endblock %}
</main>

<footer class="site-foot">
  <div class="wrap">
    <div>
      <span class="eyebrow">Nullbyte Labs &middot; Tucson, AZ</span>
      <div style="margin-top:.4rem">Built and hosted by {{ site.author }}. Last build {{ build_stamp }}.</div>
    </div>
    <div class="links">
      <a href="/tutorials/">Tutorials</a>
      <a href="/feed.xml">RSS</a>
      <a href="{{ site.youtube }}" rel="me noopener">YouTube</a>
      <a href="{{ site.github }}" rel="me noopener">GitHub</a>
    </div>
  </div>
</footer>
</body>
</html>
