{% extends "base.html" %}
{% block title %}Not found — {{ site.name }}{% endblock %}
{% block main %}
<section class="section">
  <div class="wrap">
    <span class="eyebrow">HTTP 404 &middot; connection refused</span>
    <h1 style="margin-top:1rem">No trace to that page</h1>
    <p class="lede" style="color:#c3ccd6;max-width:56ch">The link is broken or the tutorial
      moved. The index below has everything that's actually published.</p>
    <div class="btn-row" style="padding-top:1.5rem"><a class="btn btn--cyan" href="/tutorials/">&#9656; Go to the tutorial index</a></div>
  </div>
</section>
{% endblock %}
